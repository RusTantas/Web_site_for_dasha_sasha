<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; padding:0; height:200vh; background:#FAF8F5; }
.side-left, .side-right {
  position:fixed; top:0; width:60px; height:100vh; z-index:999; pointer-events:none;
}
.side-left { left:0; background:linear-gradient(180deg, #F3EDF9 0%, transparent 30%, transparent 70%, #F3EDF9 100%); }
.side-right { right:0; background:linear-gradient(180deg, #F3EDF9 0%, transparent 30%, transparent 70%, #F3EDF9 100%); }
.flower {
  position:absolute; border-radius:50%; background:#E8D5F5; opacity:0.5;
}
.f1 { width:20px; height:20px; top:8%; left:15px; background:#7B5FA8; }
.f2 { width:14px; height:14px; top:18%; left:30px; }
.f3 { width:18px; height:18px; top:32%; left:10px; background:#D4BFE5; }
.f4 { width:12px; height:12px; top:45%; left:35px; }
.f5 { width:16px; height:16px; top:58%; left:20px; background:#7B5FA8; }
.f6 { width:20px; height:20px; top:72%; left:15px; }
.f7 { width:14px; height:14px; top:85%; left:30px; background:#D4BFE5; }
.f8 { width:18px; height:18px; top:95%; left:10px; }
.right .f1 { right:15px; left:auto; }
.right .f2 { right:30px; left:auto; }
.right .f3 { right:10px; left:auto; }
.right .f4 { right:35px; left:auto; }
.right .f5 { right:20px; left:auto; }
.right .f6 { right:15px; left:auto; }
.right .f7 { right:30px; left:auto; }
.right .f8 { right:10px; left:auto; }
.content { max-width:800px; margin:0 auto; padding:40px; }
</style>
</head>
<body>
<div class="side-left"><div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div><div class="flower f4"></div><div class="flower f5"></div><div class="flower f6"></div><div class="flower f7"></div><div class="flower f8"></div></div>
<div class="side-right"><div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div><div class="flower f4"></div><div class="flower f5"></div><div class="flower f6"></div><div class="flower f7"></div><div class="flower f8"></div></div>
<div class="content"><h1>Тест фиолетовых боков</h1><p>Прокрутите страницу вниз - фиолетовые полосы по бокам должны оставаться на месте!</p><p style="margin-top:100vh;">Вы дошли до конца!</p></div>
</body>
</html>
